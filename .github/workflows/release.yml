name: Build and release QLTK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: powershell
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v([1-9][0-9]{0,8})$') { throw 'Run this workflow on a version tag such as v209' }
          "QLTK_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Windows Forms regression checks
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File QLTK/AccountManager.ps1 -UiTest
      - name: Native combat target checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:QuestTargetNativeTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/QuestTargetNativeTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Native test compilation failed'}
          ./QuestTargetNativeTests.exe
          if($LASTEXITCODE -ne 0){throw 'Native target tests failed'}
      - name: Gem level 12 at 100 percent checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:GemCombineTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/GemCombineTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Gem test compilation failed'}
          ./GemCombineTests.exe
          if($LASTEXITCODE -ne 0){throw 'Gem combine tests failed'}
      - name: Online notice confirmation checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:OnlineNoticeTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/OnlineNoticeTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Online notice test compilation failed'}
          ./OnlineNoticeTests.exe
          if($LASTEXITCODE -ne 0){throw 'Online notice tests failed'}
      - name: Beast solo quest checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:BeastQuestTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/BeastQuestTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Beast test compilation failed'}
          ./BeastQuestTests.exe
          if($LASTEXITCODE -ne 0){throw 'Beast tests failed'}
      - name: Dungeon entry and key exhaustion checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:DungeonEntryTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/DungeonEntryTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Dungeon entry test compilation failed'}
          ./DungeonEntryTests.exe
          if($LASTEXITCODE -ne 0){throw 'Dungeon entry tests failed'}
      - name: Inventory count persistence checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:BiMaTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/BiMaTests.cs')
          if($LASTEXITCODE -ne 0){throw 'BiMa test compilation failed'}
          ./BiMaTests.exe
          if($LASTEXITCODE -ne 0){throw 'BiMa tests failed'}
      - name: Activity timeout recovery checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:ActivityWatchdogTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/ActivityWatchdogTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Watchdog test compilation failed'}
          ./ActivityWatchdogTests.exe
          if($LASTEXITCODE -ne 0){throw 'Watchdog tests failed'}
      - name: Failed startup cleanup recovery checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:FailedLaunchCleanupTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/FailedLaunchCleanupTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Failed startup cleanup test compilation failed'}
          ./FailedLaunchCleanupTests.exe
          if($LASTEXITCODE -ne 0){throw 'Failed startup cleanup tests failed'}
      - name: Mail receive-delete backpressure and native packet checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          foreach($name in @('MailTests','InboxReuseTests','InboxFlowTests')){
            & $compiler /nologo /platform:x64 /out:$($name+'.exe') (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd ('QLTK/'+$name+'.cs'))
            if($LASTEXITCODE -ne 0){throw ($name+' compilation failed')}
            & (Join-Path $pwd ($name+'.exe'))
            if($LASTEXITCODE -ne 0){throw ($name+' failed')}
          }
      - name: Cuong Thi real HP and hanging threshold checks
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:CuongThiTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/CuongThiTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Cuong Thi test compilation failed'}
          ./CuongThiTests.exe
          if($LASTEXITCODE -ne 0){throw 'Cuong Thi tests failed'}
      - name: Native captcha input guards
        shell: powershell
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /platform:x64 /out:CaptchaTests.exe (Join-Path $pwd 'QLTK/NativeBackend.cs') (Join-Path $pwd 'QLTK/CaptchaTests.cs')
          if($LASTEXITCODE -ne 0){throw 'Captcha test compilation failed'}
          ./CaptchaTests.exe
          if($LASTEXITCODE -ne 0){throw 'Captcha tests failed'}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable OCR runtime
        shell: powershell
        run: |
          ./scripts/Build-OcrRuntime.ps1 -OutputDirectory (Join-Path $pwd 'dist')
          $build=@(Get-ChildItem dist -Directory -Filter 'ocr-build-*')[0]
          $runtime=Join-Path $build.FullName 'runtime/python.exe'
          & $runtime -I (Join-Path $pwd 'QLTK/CaptchaOcrTests.py')
          if($LASTEXITCODE -ne 0){throw 'OCR crop regression checks failed'}
          $info=New-Object Diagnostics.ProcessStartInfo
          $info.FileName=$runtime;$info.Arguments='-I "'+(Join-Path $pwd 'QLTK/CaptchaOcr.py')+'" --worker'
          $info.UseShellExecute=$false;$info.CreateNoWindow=$true;$info.RedirectStandardOutput=$true;$info.RedirectStandardError=$true;$info.RedirectStandardInput=$true
          $process=New-Object Diagnostics.Process;$process.StartInfo=$info;$null=$process.Start();$process.StandardInput.Close()
          $output=$process.StandardOutput.ReadToEndAsync();$errorOutput=$process.StandardError.ReadToEndAsync()
          if(!$process.WaitForExit(60000)){throw 'OCR runtime smoke test timed out'}
          if($process.ExitCode -ne 0 -or !$output.Wait(1000) -or $output.Result -notmatch 'READY'){throw 'OCR runtime smoke test failed'}
          $process.Dispose()
      - name: Build program-only update and portable bundles
        shell: powershell
        run: ./scripts/Build-Release.ps1 -Version ([int]$env:QLTK_VERSION) -Repository $env:GITHUB_REPOSITORY
      - name: Publish release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/QLTK-update.zip dist/QLTK-portable.zip dist/QLTK-ocr-runtime-win64.zip --repo $env:GITHUB_REPOSITORY --title "QLTK $env:GITHUB_REF_NAME" --generate-notes
